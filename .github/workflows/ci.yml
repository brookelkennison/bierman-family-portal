name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # A throwaway Supabase (database + auth) in Docker. Nothing here
      # touches the hosted project, and the keys are local-only defaults.
      - name: Start a throwaway Supabase
        run: pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Database tests
        run: pnpm test:db

      - name: Point the app and seed at the local Supabase
        run: |
          eval "$(pnpm -s supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> .env.local
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" > .env.seed
          echo "DEMO_PASSWORD=ci-only-demo-password-1" >> .env.seed
          # Local Supabase defaults, not secrets. Prefixes help debug key mixups.
          echo "API_URL=$API_URL"
          echo "app key starts with: $(grep PUBLISHABLE .env.local | cut -d= -f2 | cut -c1-16)"
      - run: pnpm seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
